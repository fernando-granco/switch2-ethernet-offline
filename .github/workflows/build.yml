name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # needed only to publish a release from a v* tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test
        run: python -m unittest -v

      - name: Build exe
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.21.0
          ./packaging/build_exe.ps1

      - name: Build command-line zip
        run: python packaging/build_zip.py

      - uses: actions/upload-artifact@v4
        with:
          name: switch2-ethernet-offline
          path: |
            dist/SwitchOfflineEthernet.exe
            dist/switch2-offline-cli-*.zip

      - name: Attach the exe and zip to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @('dist/SwitchOfflineEthernet.exe') + (Get-ChildItem dist/switch2-offline-cli-*.zip).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title $tag --generate-notes
          }
