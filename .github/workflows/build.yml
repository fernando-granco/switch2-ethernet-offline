name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # needed only to publish a release from a v* tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test
        run: python -m unittest -v

      - name: Build exe
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.21.0
          ./packaging/build_exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: SwitchOfflineEthernet
          path: dist/SwitchOfflineEthernet.exe

      - name: Attach the exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/SwitchOfflineEthernet.exe --clobber
          } else {
            gh release create $tag dist/SwitchOfflineEthernet.exe --title $tag --generate-notes
          }
